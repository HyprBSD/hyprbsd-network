# cargo deny check: the licences of the crates hyprbsd-network builds with on FreeBSD, RustSec's
# advisories against them, more than one version of a crate, and where crates come from.

[graph]
targets = ["x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
